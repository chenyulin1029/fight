name: FileDone P1.8B Signed QA Human Gate

on:
  push:
    branches: [ filedone-p1-8b-msix ]
    paths:
      - 'filedone/tests/human-signed/**'
      - '.github/workflows/filedone-p1-8b-signed-human-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signed-human-gate:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout gate sources
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download exact shipping MSIX
        uses: actions/download-artifact@v4
        with:
          name: FileDone-P1.8B-Shipping-MSIX-Build
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 35692146360

      - name: Build and sign QA MSIX from exact shipping payload
        run: |
          $ErrorActionPreference='Stop'
          $unsigned=(Resolve-Path 'artifacts/source/FileDone-P1.8B-Shipping-x64.msix').Path
          $expectedUnsignedHash='6EEBA692EE6AA36718B6AE0AB68EEB928A9268E70880E33216252713996253BE'
          $actualUnsignedHash=(Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash.ToUpperInvariant()
          if($actualUnsignedHash -ne $expectedUnsignedHash){ throw "unsigned source MSIX authority mismatch: $actualUnsignedHash" }

          $sdkBin=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { (Test-Path (Join-Path $_ 'makeappx.exe')) -and (Test-Path (Join-Path $_ 'signtool.exe')) } | Select-Object -First 1
          if(!$sdkBin){ throw 'Windows SDK makeappx.exe / signtool.exe not found' }
          $makeappx=Join-Path $sdkBin 'makeappx.exe'
          $signtool=Join-Path $sdkBin 'signtool.exe'

          $root='artifacts/signed-root'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx unpack /p $unsigned /d $root /o
          if($LASTEXITCODE -ne 0){ throw "makeappx unpack failed: $LASTEXITCODE" }

          $payloadHashes=[ordered]@{}
          foreach($rel in @('FileDoneRuntime.exe','FileDoneShellNative.dll','FileDoneBridge.exe','tools\ffmpeg.exe','tools\ffprobe.exe','tools\magick.exe')){
            $p=Join-Path $root $rel
            $payloadHashes[$rel]=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToUpperInvariant()
          }

          $manifest=Join-Path $root 'AppxManifest.xml'
          [xml]$xml=Get-Content -LiteralPath $manifest -Raw
          $ns=[Xml.XmlNamespaceManager]::new($xml.NameTable)
          $ns.AddNamespace('f','http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity=$xml.SelectSingleNode('/f:Package/f:Identity',$ns)
          if(!$identity){ throw 'Identity element missing' }
          $identity.SetAttribute('Name','FileDone.QATestSigned')
          $identity.SetAttribute('Publisher','CN=FileDone QA Test')
          $identity.SetAttribute('Version','2.0.1.0')
          $settings=[Xml.XmlWriterSettings]::new()
          $settings.Encoding=[Text.UTF8Encoding]::new($false)
          $settings.Indent=$true
          $writer=[Xml.XmlWriter]::Create($manifest,$settings)
          try { $xml.Save($writer) } finally { $writer.Dispose() }

          Remove-Item -LiteralPath (Join-Path $root 'AppxBlockMap.xml') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $root 'AppxSignature.p7x') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $root '[Content_Types].xml') -Force -ErrorAction SilentlyContinue

          $rootCert=New-SelfSignedCertificate -Type Custom -Subject 'CN=FileDone QA Root 2026' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -KeyUsage CertSign,CRLSign,DigitalSignature -KeyUsageProperty All -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.19={critical}{text}CA=true&pathlength=0') -FriendlyName 'FileDone P1.8B QA Root 2026' -NotAfter (Get-Date).AddYears(1)
          $leafCert=New-SelfSignedCertificate -Type Custom -Subject 'CN=FileDone QA Test' -Signer $rootCert -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={critical}{text}CA=false') -FriendlyName 'FileDone P1.8B QA Code Signing' -NotAfter (Get-Date).AddMonths(6)
          New-Item -ItemType Directory -Force -Path artifacts/bundle | Out-Null
          $rootCer='artifacts/bundle/FileDone-QA-Root.cer'
          $leafCer='artifacts/bundle/FileDone-QA-CodeSigning.cer'
          Export-Certificate -Cert $rootCert -FilePath $rootCer | Out-Null
          Export-Certificate -Cert $leafCert -FilePath $leafCer | Out-Null
          $password=ConvertTo-SecureString -String 'FileDone-QA-CI-Only-2026!' -Force -AsPlainText
          $pfx='artifacts/FileDone-QA-CodeSigning.pfx'
          Export-PfxCertificate -Cert $leafCert -FilePath $pfx -Password $password -ChainOption EndEntityCertOnly | Out-Null

          $signed='artifacts/bundle/FileDone-P1.8B-QA-Signed.msix'
          & $makeappx pack /d $root /p $signed /o
          if($LASTEXITCODE -ne 0){ throw "makeappx signed repack failed: $LASTEXITCODE" }
          & $signtool sign /fd SHA256 /f $pfx /p 'FileDone-QA-CI-Only-2026!' /ac $rootCer $signed
          if($LASTEXITCODE -ne 0){ throw "signtool sign failed: $LASTEXITCODE" }

          & certutil.exe -addStore -f Root $rootCer | Out-Host
          if($LASTEXITCODE -ne 0){ throw "certutil Root import failed before verify: $LASTEXITCODE" }
          & $signtool verify /pa /v /r 'FileDone QA Root 2026' $signed
          if($LASTEXITCODE -ne 0){ throw "signtool verify failed: $LASTEXITCODE" }

          foreach($rel in $payloadHashes.Keys){
            $after=(Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash.ToUpperInvariant()
            if($after -ne $payloadHashes[$rel]){ throw "shipping payload mutated while signing: $rel" }
          }

          $signedHash=(Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash.ToUpperInvariant()
          $signedBytes=(Get-Item -LiteralPath $signed).Length
          $rootFileHash=(Get-FileHash -LiteralPath $rootCer -Algorithm SHA256).Hash.ToUpperInvariant()
          $leafFileHash=(Get-FileHash -LiteralPath $leafCer -Algorithm SHA256).Hash.ToUpperInvariant()
          [ordered]@{
            gate='P1.8B_SIGNED_QA_HUMAN_GATE_ROOT_CHAIN'
            sourceUnsignedRun=35692146360
            sourceUnsignedCommit='45e8e48443233485f3765486bed85635042c3485'
            sourceUnsignedMsixSha256=$actualUnsignedHash
            signedPackageName='FileDone.QATestSigned'
            signedPublisher='CN=FileDone QA Test'
            signedMsixSha256=$signedHash
            signedMsixBytes=$signedBytes
            rootCertificateSubject=$rootCert.Subject
            rootCertificateThumbprint=$rootCert.Thumbprint.ToUpperInvariant()
            rootCertificateFileSha256=$rootFileHash
            leafCertificateSubject=$leafCert.Subject
            leafCertificateIssuer=$leafCert.Issuer
            leafCertificateThumbprint=$leafCert.Thumbprint.ToUpperInvariant()
            leafCertificateFileSha256=$leafFileHash
            payloadHashes=$payloadHashes
          } | ConvertTo-Json -Depth 8 | Set-Content artifacts/bundle/SIGNED_GATE_AUTHORITY.json -Encoding utf8

          Remove-Item -LiteralPath $pfx -Force
          Write-Host "FILEDONE_SIGNED_QA_ROOT_CHAIN_BUILD_PASS SHA256=$signedHash BYTES=$signedBytes ROOT=$($rootCert.Thumbprint) LEAF=$($leafCert.Thumbprint)"

      - name: Install signed QA package and smoke packaged COM
        run: |
          $ErrorActionPreference='Stop'
          $bundle=(Resolve-Path 'artifacts/bundle').Path
          $rootCert=Join-Path $bundle 'FileDone-QA-Root.cer'
          $leafCert=Join-Path $bundle 'FileDone-QA-CodeSigning.cer'
          $msix=Join-Path $bundle 'FileDone-P1.8B-QA-Signed.msix'
          & certutil.exe -addStore -f Root $rootCert | Out-Host
          if($LASTEXITCODE -ne 0){ throw "certutil Root import failed: $LASTEXITCODE" }
          & certutil.exe -addStore -f TrustedPeople $leafCert | Out-Host
          if($LASTEXITCODE -ne 0){ throw "certutil TrustedPeople leaf import failed: $LASTEXITCODE" }
          Get-AppxPackage -Name FileDone.QATestSigned -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $msix -ForceApplicationShutdown -ErrorAction Stop
          $installed=Get-AppxPackage -Name FileDone.QATestSigned -ErrorAction Stop | Select-Object -First 1
          if(!$installed){ throw 'signed QA package registration missing' }

          New-Item -ItemType Directory -Force -Path artifacts/probe | Out-Null
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /O2 /DUNICODE /D_UNICODE filedone/tests/package/PackagedComProbe.cpp /Fe:artifacts/probe/PackagedComProbe.exe /link ole32.lib shell32.lib
          if($LASTEXITCODE -ne 0){ throw "PackagedComProbe compile failed: $LASTEXITCODE" }

          Add-Type -AssemblyName System.Drawing
          $smoke=Join-Path $env:TEMP ("FileDone Signed QA Smoke " + $PID)
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          try {
            $fixture=Join-Path $smoke 'signed qa.bmp'
            $bmp=[System.Drawing.Bitmap]::new(96,64)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(32,96,160))
            $bmp.Save($fixture,[System.Drawing.Imaging.ImageFormat]::Bmp)
            $g.Dispose(); $bmp.Dispose()
            & artifacts/probe/PackagedComProbe.exe $fixture
            if($LASTEXITCODE -ne 0){ throw "PackagedComProbe failed: $LASTEXITCODE" }
            $expected=Join-Path $smoke 'signed qa_compatible.jpg'
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            while([DateTime]::UtcNow -lt $deadline -and !(Test-Path -LiteralPath $expected -PathType Leaf)){ Start-Sleep -Milliseconds 250 }
            if(!(Test-Path -LiteralPath $expected -PathType Leaf)){ throw 'signed QA shell Invoke did not produce output' }
            Write-Host "FILEDONE_SIGNED_QA_ROOT_CHAIN_COM_SHELL_RUNTIME_PASS BYTES=$((Get-Item -LiteralPath $expected).Length)"
          } finally {
            Remove-Item -LiteralPath $smoke -Recurse -Force -ErrorAction SilentlyContinue
            Get-AppxPackage -Name FileDone.QATestSigned -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }

      - name: Stage signed Human Gate bundle
        run: |
          $ErrorActionPreference='Stop'
          $bundle='artifacts/bundle'
          Copy-Item filedone/tests/human-signed/Trust-TestCertificate.ps1 $bundle/ -Force
          Copy-Item filedone/tests/human-signed/Remove-TestCertificate.ps1 $bundle/ -Force
          Copy-Item filedone/tests/human-signed/Prepare-SignedHumanExplorerGate.ps1 $bundle/ -Force
          Copy-Item filedone/tests/human-signed/Verify-SignedHumanExplorerGate.ps1 $bundle/ -Force
          Copy-Item filedone/tests/human-signed/RUN_SIGNED_HUMAN_EXPLORER_GATE.cmd $bundle/ -Force
          Copy-Item filedone/tests/human-signed/CHECK_SIGNED_RESULTS.cmd $bundle/ -Force
          Copy-Item filedone/tests/human-signed/CLEANUP_SIGNED_GATE.cmd $bundle/ -Force
          Copy-Item filedone/tests/human-signed/HUMAN_GATE_CHECKLIST.txt $bundle/ -Force
          foreach($script in @("$bundle/Trust-TestCertificate.ps1","$bundle/Remove-TestCertificate.ps1","$bundle/Prepare-SignedHumanExplorerGate.ps1","$bundle/Verify-SignedHumanExplorerGate.ps1")){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ throw "PowerShell syntax error in $script : $($errors[0].Message)" }
          }
          Write-Host 'FILEDONE_SIGNED_QA_HUMAN_GATE_BUNDLE_PASS'

      - name: Upload signed Human Explorer Gate
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-P1.8B-SIGNED-Human-Explorer-Gate
          path: artifacts/bundle/
          if-no-files-found: error
          retention-days: 14