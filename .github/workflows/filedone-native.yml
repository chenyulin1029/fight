name: FileDone Native Build

on:
  push:
    branches: [ filedone-native-ci ]
    paths:
      - 'filedone/**'
      - '.github/workflows/filedone-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native shell and bridge
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path filedone/out | Out-Null

          cl.exe /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /LD `
            filedone/src/FileDoneShell.cpp `
            /Fe:filedone/out/FileDoneShellNative.dll `
            /link /DEF:filedone/src/FileDoneShell.def ole32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw "FileDoneShellNative.dll compile failed: $LASTEXITCODE" }

          cl.exe /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE `
            filedone/src/FileDoneBridge.cpp `
            /Fe:filedone/out/FileDoneBridge.exe `
            /link user32.lib shell32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { throw "FileDoneBridge.exe compile failed: $LASTEXITCODE" }

      - name: Verify PE and COM exports
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path filedone/out/FileDoneShellNative.dll)) { throw 'Shell DLL missing' }
          if (!(Test-Path filedone/out/FileDoneBridge.exe)) { throw 'Bridge EXE missing' }

          $exports = (& dumpbin.exe /exports filedone/out/FileDoneShellNative.dll) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($exports -notmatch '(?m)\bDllGetClassObject\b') { throw 'DllGetClassObject export missing' }
          if ($exports -notmatch '(?m)\bDllCanUnloadNow\b') { throw 'DllCanUnloadNow export missing' }

          $headers = (& dumpbin.exe /headers filedone/out/FileDoneShellNative.dll) -join "`n"
          if ($headers -notmatch 'machine \(x64\)') { throw 'Shell DLL is not x64' }

      - name: Build signed FileDone shell MSIX
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') } |
            Select-Object -First 1
          if (!$sdkBin) { throw 'Windows SDK packaging tools not found' }
          $makeappx = Join-Path $sdkBin 'makeappx.exe'
          $signtool = Join-Path $sdkBin 'signtool.exe'

          $pkg = 'filedone/pkg'
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg/Assets" | Out-Null
          Copy-Item filedone/package/AppxManifest.xml "$pkg/AppxManifest.xml"
          Copy-Item filedone/out/FileDoneShellNative.dll "$pkg/FileDoneShellNative.dll"
          Copy-Item filedone/out/FileDoneBridge.exe "$pkg/FileDoneBridge.exe"

          Add-Type -AssemblyName System.Drawing
          foreach ($s in @(44,150)) {
            $bmp = New-Object System.Drawing.Bitmap($s,$s)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::White)
            $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(117,203,232))
            $m = [Math]::Max(4,[int]($s/5))
            $g.FillEllipse($brush,$m,$m,$s-2*$m,$s-2*$m)
            $path = if ($s -eq 44) { "$pkg/Assets/Square44x44Logo.png" } else { "$pkg/Assets/Square150x150Logo.png" }
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $brush.Dispose(); $g.Dispose(); $bmp.Dispose()
          }

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=FileDone Development' `
            -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath filedone/out/FileDoneDev.cer | Out-Null

          & $makeappx pack /d $pkg /p filedone/out/FileDone.DevShell.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed: $LASTEXITCODE" }

          & $signtool sign /fd SHA256 /s My /sha1 $cert.Thumbprint filedone/out/FileDone.DevShell.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }

          $signature = Get-AuthenticodeSignature filedone/out/FileDone.DevShell.msix
          if (!$signature.SignerCertificate) { throw 'MSIX signature is missing' }
          if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'MSIX signer certificate mismatch' }
          if ($signature.Status -eq 'HashMismatch' -or $signature.Status -eq 'NotSigned') { throw "MSIX signature integrity failed: $($signature.Status)" }

      - name: Install and remove package smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Certificate -FilePath filedone/out/FileDoneDev.cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          Import-Certificate -FilePath filedone/out/FileDoneDev.cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null

          Get-AppxPackage -Name FileDone.DevShell -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path (Resolve-Path filedone/out/FileDone.DevShell.msix) -ErrorAction Stop

          $installed = Get-AppxPackage -Name FileDone.DevShell -ErrorAction Stop | Select-Object -First 1
          if (!$installed) { throw 'FileDone package was not registered' }
          if (!(Test-Path (Join-Path $installed.InstallLocation 'FileDoneShellNative.dll'))) { throw 'Installed shell DLL missing' }
          if (!(Test-Path (Join-Path $installed.InstallLocation 'FileDoneBridge.exe'))) { throw 'Installed bridge EXE missing' }

          $installed | Remove-AppxPackage -ErrorAction Stop
          if (Get-AppxPackage -Name FileDone.DevShell -ErrorAction SilentlyContinue) { throw 'FileDone package remained after smoke-test uninstall' }

      - name: Print artifact hashes
        run: |
          Get-FileHash filedone/out/FileDoneShellNative.dll -Algorithm SHA256 | Format-List
          Get-FileHash filedone/out/FileDoneBridge.exe -Algorithm SHA256 | Format-List
          Get-FileHash filedone/out/FileDone.DevShell.msix -Algorithm SHA256 | Format-List
          Get-FileHash filedone/out/FileDoneDev.cer -Algorithm SHA256 | Format-List

      - name: Upload prebuilt FileDone shell package
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-prebuilt-x64
          path: |
            filedone/out/FileDoneShellNative.dll
            filedone/out/FileDoneBridge.exe
            filedone/out/FileDone.DevShell.msix
            filedone/out/FileDoneDev.cer
          if-no-files-found: error
          retention-days: 14
