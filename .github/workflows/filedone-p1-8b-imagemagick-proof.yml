name: FileDone P1.8B ImageMagick Proof

on:
  push:
    branches: [ filedone-p1-8b-codec-proof ]
    paths:
      - 'filedone/tests/package/Probe-ImageMagickSbom.ps1'
      - 'filedone/tests/package/Probe-ImageMagickTrim.ps1'
      - '.github/workflows/filedone-p1-8b-imagemagick-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagemagick-sbom-proof:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe official portable archive and SBOM
        run: pwsh -NoLogo -NoProfile -File filedone/tests/package/Probe-ImageMagickSbom.ps1

      - name: Prove FileDone image paths without OpenH264 payload
        run: pwsh -NoLogo -NoProfile -File filedone/tests/package/Probe-ImageMagickTrim.ps1
