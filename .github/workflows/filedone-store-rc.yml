name: FileDone Store Release Candidate

on:
  push:
    branches: [ filedone-store-rc ]
    paths:
      - 'filedone/tests/store/**'
      - '.github/workflows/filedone-store-rc.yml'
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity Name (exact, case-sensitive)'
        required: true
        type: string
      publisher:
        description: 'Partner Center Publisher (exact, case-sensitive)'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center publisher display name'
        required: true
        default: 'FileDone'
        type: string
      version:
        description: 'Store package version A.B.C.0'
        required: true
        default: '2.0.2.0'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  store-rc:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Store RC sources
        uses: actions/checkout@v4

      - name: Download exact shipping authority MSIX
        uses: actions/download-artifact@v4
        with:
          name: FileDone-P1.8B-Shipping-MSIX-Build
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 35692146360

      - name: Resolve Store identity mode
        run: |
          $ErrorActionPreference='Stop'
          if('${{ github.event_name }}' -eq 'workflow_dispatch'){
            $identity='${{ inputs.identity_name }}'
            $publisher='${{ inputs.publisher }}'
            $publisherDisplay='${{ inputs.publisher_display_name }}'
            $version='${{ inputs.version }}'
            $preview='false'
          } else {
            $identity='FileDone.StorePreview'
            $publisher='CN=FileDone Store Preview'
            $publisherDisplay='FileDone'
            $version='2.0.2.0'
            $preview='true'
          }
          if([string]::IsNullOrWhiteSpace($identity) -or [string]::IsNullOrWhiteSpace($publisher)){ throw 'Store identity inputs are empty.' }
          "STORE_IDENTITY_NAME=$identity" | Out-File $env:GITHUB_ENV -Append
          "STORE_PUBLISHER=$publisher" | Out-File $env:GITHUB_ENV -Append
          "STORE_PUBLISHER_DISPLAY=$publisherDisplay" | Out-File $env:GITHUB_ENV -Append
          "STORE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "STORE_PREVIEW=$preview" | Out-File $env:GITHUB_ENV -Append

      - name: Build Store RC from frozen shipping payload
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts/store | Out-Null
          $args=@(
            '-SourceMsix','artifacts/source/FileDone-P1.8B-Shipping-x64.msix',
            '-OutputMsix','artifacts/store/FileDone-Store-RC-x64.msix',
            '-IdentityName',$env:STORE_IDENTITY_NAME,
            '-Publisher',$env:STORE_PUBLISHER,
            '-PublisherDisplayName',$env:STORE_PUBLISHER_DISPLAY,
            '-Version',$env:STORE_VERSION,
            '-EvidencePath','artifacts/store/store-rc-evidence.json',
            '-RunWack'
          )
          if($env:STORE_PREVIEW -eq 'true'){ $args += '-Preview' }
          & pwsh -NoLogo -NoProfile -File filedone/tests/store/Build-StoreReleaseCandidate.ps1 @args
          if($LASTEXITCODE -ne 0){ throw "Store RC build failed: $LASTEXITCODE" }

      - name: Verify Store RC evidence boundary
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content artifacts/store/store-rc-evidence.json -Raw | ConvertFrom-Json
          if($e.status -ne 'PASS'){ throw 'Store RC evidence did not PASS.' }
          if($e.wack -ne 'PASS'){ throw 'WACK did not PASS.' }
          if($env:STORE_PREVIEW -eq 'true'){
            if(!$e.preview){ throw 'Preview build evidence mismatch.' }
            Write-Host 'FILEDONE_STORE_RC_STRUCTURAL_PREVIEW_MACHINE_PASS'
          } else {
            if($e.preview){ throw 'Final submission build incorrectly marked preview.' }
            if($e.identityName -ne $env:STORE_IDENTITY_NAME -or $e.publisher -ne $env:STORE_PUBLISHER){ throw 'Partner Center identity evidence mismatch.' }
            Write-Host 'FILEDONE_STORE_RC_SUBMISSION_MACHINE_PASS'
          }

      - name: Upload Store RC
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-Store-RC-${{ github.run_number }}
          path: |
            artifacts/store/FileDone-Store-RC-x64.msix
            artifacts/store/store-rc-evidence.json
            artifacts/store/WACK-report.xml
          if-no-files-found: error
          retention-days: 30