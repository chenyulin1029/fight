name: FileDone Store Release Candidate

on:
  push:
    branches: [ filedone-store-rc ]
    paths:
      - 'filedone/tests/store/**'
      - 'filedone/store/**'
      - '.github/workflows/filedone-store-rc.yml'
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity Name (exact, case-sensitive)'
        required: true
        type: string
      publisher:
        description: 'Partner Center Publisher (exact, case-sensitive)'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center publisher display name'
        required: true
        default: 'FileDone'
        type: string
      version:
        description: 'Store package version A.B.C.0'
        required: true
        default: '2.0.2.0'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  store-rc:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Store RC sources
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build dedicated Store entry
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts/store-entry,artifacts/evidence | Out-Null
          & cl.exe /nologo /std:c++17 /EHsc /MT /DUNICODE /D_UNICODE /W4 /WX /O2 filedone/store/FileDoneStoreEntry.cpp /Fe:artifacts/store-entry/FileDoneStoreEntry.exe /link user32.lib /SUBSYSTEM:WINDOWS
          if($LASTEXITCODE -ne 0){ throw "FileDoneStoreEntry compile failed: $LASTEXITCODE" }
          & mt.exe -nologo -manifest filedone/store/FileDoneStoreEntry.manifest '-outputresource:artifacts/store-entry/FileDoneStoreEntry.exe;#1'
          if($LASTEXITCODE -ne 0){ throw "FileDoneStoreEntry manifest embed failed: $LASTEXITCODE" }
          pwsh -NoLogo -NoProfile -File filedone/tests/package/Verify-PortablePE.ps1 -ToolPath artifacts/store-entry/FileDoneStoreEntry.exe -EvidencePath artifacts/evidence/store-entry-portable-pe.json
          if($LASTEXITCODE -ne 0){ throw "Store entry portable PE gate failed: $LASTEXITCODE" }
          Write-Host 'FILEDONE_STORE_ENTRY_BUILD_PASS'

      - name: Download exact shipping authority MSIX
        uses: actions/download-artifact@v4
        with:
          name: FileDone-P1.8B-Shipping-MSIX-Build
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 35692146360

      - name: Resolve Store identity mode
        run: |
          $ErrorActionPreference='Stop'
          if('${{ github.event_name }}' -eq 'workflow_dispatch'){
            $identity='${{ inputs.identity_name }}'
            $publisher='${{ inputs.publisher }}'
            $publisherDisplay='${{ inputs.publisher_display_name }}'
            $version='${{ inputs.version }}'
            $preview='false'
          } else {
            $identity='FileDone.StorePreview'
            $publisher='CN=FileDone Store Preview'
            $publisherDisplay='FileDone'
            $version='2.0.2.0'
            $preview='true'
          }
          if([string]::IsNullOrWhiteSpace($identity) -or [string]::IsNullOrWhiteSpace($publisher)){ throw 'Store identity inputs are empty.' }
          "STORE_IDENTITY_NAME=$identity" | Out-File $env:GITHUB_ENV -Append
          "STORE_PUBLISHER=$publisher" | Out-File $env:GITHUB_ENV -Append
          "STORE_PUBLISHER_DISPLAY=$publisherDisplay" | Out-File $env:GITHUB_ENV -Append
          "STORE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "STORE_PREVIEW=$preview" | Out-File $env:GITHUB_ENV -Append

      - name: Build Store RC from frozen shipping payload
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts/store | Out-Null
          $args=@(
            '-SourceMsix','artifacts/source/FileDone-P1.8B-Shipping-x64.msix',
            '-OutputMsix','artifacts/store/FileDone-Store-RC-x64.msix',
            '-IdentityName',$env:STORE_IDENTITY_NAME,
            '-Publisher',$env:STORE_PUBLISHER,
            '-PublisherDisplayName',$env:STORE_PUBLISHER_DISPLAY,
            '-StoreEntryExe',(Resolve-Path 'artifacts/store-entry/FileDoneStoreEntry.exe').Path,
            '-Version',$env:STORE_VERSION,
            '-EvidencePath','artifacts/store/store-rc-evidence.json'
          )
          if($env:STORE_PREVIEW -eq 'true'){ $args += '-Preview' }
          & pwsh -NoLogo -NoProfile -File filedone/tests/store/Build-StoreReleaseCandidate.ps1 @args
          if($LASTEXITCODE -ne 0){ throw "Store RC build failed: $LASTEXITCODE" }
          Copy-Item filedone/tests/store/Run-StoreWackGate.ps1 artifacts/store/ -Force
          Copy-Item filedone/tests/store/RUN_STORE_WACK_GATE.cmd artifacts/store/ -Force
          if(!(Test-Path artifacts/store/FileDone-Store-RC-Signer.cer)){ throw 'Store RC public validation certificate missing.' }
          Write-Host 'FILEDONE_STORE_RC_WACK_HANDOFF_STAGED'

      - name: Verify Store RC evidence boundary
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content artifacts/store/store-rc-evidence.json -Raw | ConvertFrom-Json
          if($e.status -ne 'PASS'){ throw 'Store RC evidence did not PASS.' }
          if(-not $e.legacyBridgeRemoved){ throw 'Legacy FileDoneBridge.exe remained in Store RC.' }
          if($e.storeEntryExe -ne 'FileDoneStoreEntry.exe'){ throw 'Dedicated Store entry evidence missing.' }
          if($e.wack -ne 'EXTERNAL_REQUIRED'){ throw 'Store RC must require external active-user WACK gate.' }
          if($env:STORE_PREVIEW -eq 'true'){
            if(!$e.preview){ throw 'Preview build evidence mismatch.' }
            Write-Host 'FILEDONE_STORE_RC_STRUCTURAL_PREVIEW_MACHINE_PASS'
          } else {
            if($e.preview){ throw 'Final submission build incorrectly marked preview.' }
            if($e.identityName -ne $env:STORE_IDENTITY_NAME -or $e.publisher -ne $env:STORE_PUBLISHER){ throw 'Partner Center identity evidence mismatch.' }
            Write-Host 'FILEDONE_STORE_RC_PACKAGE_MACHINE_PASS'
          }

      - name: Upload Store RC
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-Store-RC-${{ github.run_number }}
          path: |
            artifacts/store/FileDone-Store-RC-x64.msix
            artifacts/store/store-rc-evidence.json
            artifacts/store/FileDone-Store-RC-Signer.cer
            artifacts/store/Run-StoreWackGate.ps1
            artifacts/store/RUN_STORE_WACK_GATE.cmd
          if-no-files-found: error
          retention-days: 30