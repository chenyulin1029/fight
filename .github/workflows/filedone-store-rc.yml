name: FileDone Store RC Packaging

on:
  push:
    branches: [ filedone-p1-8b-msix ]
    paths:
      - 'filedone/tests/store/**'
      - 'filedone/package/STORE_*.md'
      - '.github/workflows/filedone-store-rc.yml'
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity/Name'
        required: true
        type: string
      publisher:
        description: 'Partner Center Package/Identity/Publisher'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center Package/Properties/PublisherDisplayName'
        required: true
        type: string
      version:
        description: 'Store package version; fourth part must be 0'
        required: true
        default: '2.0.1.0'
        type: string
      display_name:
        description: 'Store display name'
        required: true
        default: 'FileDone'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  store-rc:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout FileDone
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DPI-aware Store entry
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts/store-entry,artifacts/evidence | Out-Null
          & cl.exe /nologo /std:c++17 /EHsc /MT /DUNICODE /D_UNICODE /W4 /WX /O2 filedone/store/FileDoneStoreEntry.cpp /Fe:artifacts/store-entry/FileDoneStoreEntry.exe /link user32.lib /SUBSYSTEM:WINDOWS
          if($LASTEXITCODE -ne 0){ throw "FileDoneStoreEntry compile failed: $LASTEXITCODE" }
          & mt.exe -nologo -manifest filedone/store/FileDoneStoreEntry.manifest '-outputresource:artifacts/store-entry/FileDoneStoreEntry.exe;#1'
          if($LASTEXITCODE -ne 0){ throw "FileDoneStoreEntry manifest embed failed: $LASTEXITCODE" }
          pwsh -NoLogo -NoProfile -File filedone/tests/package/Verify-PortablePE.ps1 -ToolPath artifacts/store-entry/FileDoneStoreEntry.exe -EvidencePath artifacts/evidence/store-entry-portable-pe.json
          if($LASTEXITCODE -ne 0){ throw "Store entry portable PE gate failed: $LASTEXITCODE" }
          Write-Host 'FILEDONE_STORE_ENTRY_BUILD_PASS'

      - name: Download exact validated shipping MSIX
        uses: actions/download-artifact@v4
        with:
          name: FileDone-P1.8B-Shipping-MSIX-Build
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 35692146360

      - name: Resolve Store identity inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IDENTITY_NAME: ${{ inputs.identity_name }}
          INPUT_PUBLISHER: ${{ inputs.publisher }}
          INPUT_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:EVENT_NAME -eq 'workflow_dispatch'){
            $identity=$env:INPUT_IDENTITY_NAME
            $publisher=$env:INPUT_PUBLISHER
            $publisherDisplayName=$env:INPUT_PUBLISHER_DISPLAY_NAME
            $version=$env:INPUT_VERSION
            $displayName=$env:INPUT_DISPLAY_NAME
            $mode='REAL_STORE_RC'
          } else {
            $identity='Contoso.FileDone.StorePipeline'
            $publisher='CN=Contoso Store Pipeline'
            $publisherDisplayName='Contoso'
            $version='2.0.1.0'
            $displayName='FileDone'
            $mode='PIPELINE_SELFTEST'
          }

          $pairs=@{
            FILEDONE_STORE_IDENTITY_NAME=$identity
            FILEDONE_STORE_PUBLISHER=$publisher
            FILEDONE_STORE_PUBLISHER_DISPLAY_NAME=$publisherDisplayName
            FILEDONE_STORE_VERSION=$version
            FILEDONE_STORE_DISPLAY_NAME=$displayName
            FILEDONE_STORE_MODE=$mode
          }
          foreach($pair in $pairs.GetEnumerator()){
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ($pair.Key + '=' + $pair.Value)
          }
          Write-Host "FILEDONE_STORE_INPUTS_RESOLVED MODE=$mode VERSION=$version"

      - name: Build Store RC package from shipping authority
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path 'artifacts/source/FileDone-P1.8B-Shipping-x64.msix').Path
          $args=@(
            '-NoLogo','-NoProfile','-File','filedone/tests/store/Build-StoreSubmission.ps1',
            '-SourceMsix',$source,
            '-IdentityName',$env:FILEDONE_STORE_IDENTITY_NAME,
            '-Publisher',$env:FILEDONE_STORE_PUBLISHER,
            '-PublisherDisplayName',$env:FILEDONE_STORE_PUBLISHER_DISPLAY_NAME,
            '-StoreEntryExe',(Resolve-Path 'artifacts/store-entry/FileDoneStoreEntry.exe').Path,
            '-Version',$env:FILEDONE_STORE_VERSION,
            '-DisplayName',$env:FILEDONE_STORE_DISPLAY_NAME,
            '-OutputDirectory','artifacts/store-rc'
          )
          & pwsh @args
          if($LASTEXITCODE -ne 0){ throw "Store RC builder failed: $LASTEXITCODE" }

      - name: Verify Store submission surface
        run: |
          $ErrorActionPreference='Stop'
          $authority=Get-Content artifacts/store-rc/STORE_RC_AUTHORITY.json -Raw | ConvertFrom-Json
          if($authority.status -ne 'PASS'){ throw 'Store RC authority status is not PASS' }
          if($authority.sourceShippingMsixSha256 -ne '6EEBA692EE6AA36718B6AE0AB68EEB928A9268E70880E33216252713996253BE'){ throw 'Store RC source authority changed' }
          if($authority.qaResidue){ throw 'Store RC still contains QA residue' }
          if($authority.signedByDeveloper){ throw 'Store RC must remain unsigned for Microsoft Store signing' }
          if($authority.processorArchitecture -ne 'x64'){ throw 'Store RC architecture changed' }
          if(-not $authority.legacyBridgeRemoved){ throw 'Legacy bridge was not removed from Store RC' }
          if($authority.storeEntryExe -ne 'FileDoneStoreEntry.exe'){ throw 'Store entry authority missing' }

          $upload=Get-ChildItem artifacts/store-rc -Filter '*.msixupload' -File | Select-Object -First 1
          $msix=Get-ChildItem artifacts/store-rc -Filter '*.msix' -File | Select-Object -First 1
          if(!$upload -or !$msix){ throw 'Store RC .msix or .msixupload missing' }

          if($env:FILEDONE_STORE_MODE -eq 'REAL_STORE_RC'){
            if($authority.identityName -ne $env:FILEDONE_STORE_IDENTITY_NAME){ throw 'Real Store identity Name mismatch' }
            if($authority.publisher -ne $env:FILEDONE_STORE_PUBLISHER){ throw 'Real Store Publisher mismatch' }
            if($authority.publisherDisplayName -ne $env:FILEDONE_STORE_PUBLISHER_DISPLAY_NAME){ throw 'Real Store PublisherDisplayName mismatch' }
            Write-Host 'FILEDONE_REAL_STORE_IDENTITY_GATE_PASS'
          } else {
            Write-Host 'FILEDONE_STORE_PIPELINE_SELFTEST_PASS'
          }
          Write-Host "FILEDONE_STORE_RC_SURFACE_PASS MSIX=$($msix.Name) UPLOAD=$($upload.Name)"

      - name: Upload real Store RC
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-Store-RC
          path: artifacts/store-rc/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Store pipeline self-test
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileDone-Store-Pipeline-SelfTest
          path: artifacts/store-rc/
          if-no-files-found: error
          retention-days: 7
