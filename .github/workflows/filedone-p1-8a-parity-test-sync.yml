name: FileDone P1.8A Parity Harness Sync

on:
  push:
    branches: [filedone-p1-8a-inline]
    paths:
      - .github/workflows/filedone-p1-8a-parity-test-sync.yml

permissions:
  contents: write

jobs:
  patch-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: filedone-p1-8a-inline
          fetch-depth: 1

      - name: Apply exact harness-only fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('filedone/tests/integration/Run-RuntimeDispatcher.ps1'): [
                  ("$fitOutput = Join-Path $root 'fit target_under.jpg'",
                   "$fitOutput = Join-Path $root 'fit target_under_0.12MB.jpg'"),
              ],
              Path('filedone/tests/integration/Run-Round2.ps1'): [
                  ("$output = Join-Path $root 'fit video_under.mp4'",
                   "$output = Join-Path $root 'fit video_under_0.3MB.mp4'"),
              ],
              Path('filedone/tests/integration/Run-OracleParity.ps1'): [
                  ("'P-03' { return @{status='success';outputCount=1;extension='.jpg';suffix='_under.jpg';originalUnchanged=$true;underTarget=$true} }",
                   "'P-03' { return @{status='success';outputCount=1;extension='.jpg';suffix='_under_0.12MB.jpg';originalUnchanged=$true;underTarget=$true} }"),
                  ("    $values=@($values | Sort-Object)\n",
                   "    [string[]]$ordered=@($values)\n    [Array]::Sort($ordered,[StringComparer]::Ordinal)\n    $values=@($ordered)\n"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git diff -- filedone/tests/integration/Run-RuntimeDispatcher.ps1 filedone/tests/integration/Run-Round2.ps1 filedone/tests/integration/Run-OracleParity.ps1
          test -z "$(git diff --name-only | grep -v -E '^(filedone/tests/integration/Run-RuntimeDispatcher.ps1|filedone/tests/integration/Run-Round2.ps1|filedone/tests/integration/Run-OracleParity.ps1)$' || true)"

      - name: Commit harness sync and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'FileDone CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/filedone-p1-8a-parity-test-sync.yml
          git add filedone/tests/integration/Run-RuntimeDispatcher.ps1 filedone/tests/integration/Run-Round2.ps1 filedone/tests/integration/Run-OracleParity.ps1
          git commit -m 'test: align parity harness with frozen oracle semantics'
          git push origin HEAD:filedone-p1-8a-inline
